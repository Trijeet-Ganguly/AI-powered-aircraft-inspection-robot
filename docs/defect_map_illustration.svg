<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="560" fill="#0d1b2a"/>
  <text x="500" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#e0e1dd">Defect Map: Illustrative Example</text>
  <rect x="60" y="80" width="600" height="400" rx="6" fill="#adb5bd" stroke="#e0e1dd" stroke-width="3"/>
  <g stroke="#868e96" stroke-width="1">
    <line x1="160" y1="80" x2="160" y2="480"/><line x1="260" y1="80" x2="260" y2="480"/><line x1="360" y1="80" x2="360" y2="480"/><line x1="460" y1="80" x2="460" y2="480"/><line x1="560" y1="80" x2="560" y2="480"/>
    <line x1="60" y1="180" x2="660" y2="180"/><line x1="60" y1="280" x2="660" y2="280"/><line x1="60" y1="380" x2="660" y2="380"/>
  </g>
  <g fill="none" stroke-width="4">
    <rect x="180" y="110" width="60" height="50" stroke="#ffb703"/>
    <rect x="430" y="200" width="80" height="34" stroke="#e63946"/>
    <rect x="100" y="330" width="64" height="64" stroke="#4cc9f0"/>
    <rect x="560" y="390" width="70" height="60" stroke="#ffb703"/>
  </g>
  <g font-size="14" font-weight="700">
    <text x="180" y="104" fill="#ffb703">corrosion</text><text x="430" y="194" fill="#e63946">crack</text><text x="100" y="324" fill="#4cc9f0">dent</text><text x="560" y="384" fill="#ffb703">corrosion</text>
  </g>
  <g font-size="16" fill="#e0e1dd">
    <text x="700" y="120" font-weight="700">Legend</text>
    <rect x="700" y="140" width="24" height="16" fill="none" stroke="#ffb703" stroke-width="4"/><text x="736" y="154">Corrosion</text>
    <rect x="700" y="174" width="24" height="16" fill="none" stroke="#e63946" stroke-width="4"/><text x="736" y="188">Crack</text>
    <rect x="700" y="208" width="24" height="16" fill="none" stroke="#4cc9f0" stroke-width="4"/><text x="736" y="222">Dent</text>
    <text x="700" y="280" font-weight="700">Output files</text>
    <text x="700" y="306">defect_map.png</text><text x="700" y="330">mosaic.png</text><text x="700" y="354">defects.csv</text><text x="700" y="378">report.json</text>
  </g>
  <text x="500" y="525" text-anchor="middle" font-size="15" fill="#8ecae6">Hand-drawn layout showing the kind of output the mapper produces. These are not measured results.</text>
</svg>
